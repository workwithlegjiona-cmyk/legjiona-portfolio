/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dir = p => CONFIG.assets + '/' + p;

function probe(base){
  return new Promise(res=>{
    let i=0;
    const next=()=>{
      if(i>=CONFIG.exts.length) return res(null);
      const url = base+'.'+CONFIG.exts[i++];
      const im = new Image();
      im.onload=()=>res(url); im.onerror=next; im.src=url;
    };
    next();
  });
}
/* A photo slot: shows image if found, otherwise a labeled placeholder */
function slot(base, label, opts={}){
  const id = 's'+Math.random().toString(36).slice(2,9);
  const cls = ['slot', opts.logo?'logo':'', opts.single?'single':'', opts.fit?'fit':''].join(' ');
  const st = (opts.ar||opts.bg) ? ` style="${opts.ar?`--ar:${opts.ar};`:''}${opts.bg?`background:${opts.bg};`:''}"` : '';
  setTimeout(()=>probe(base).then(url=>{
    const el = document.getElementById(id); if(!el) return;
    if(url){ el.className=cls; el.innerHTML=`<img src="${url}" alt="${esc(label||'')}" loading="lazy">`; }
    else if(!CONFIG.showPlaceholders){ el.remove(); }
  }),0);
  const hint = base.replace(CONFIG.assets+'/','');
  return `<div id="${id}" class="${cls} empty"${st}><div><b>🖼</b>${esc(label||t(UI.photo))}<code>${esc(hint)}.jpg</code></div></div>`;
}
/* A gallery: tries prefix-1 … prefix-N, keeps the ones that exist */
function gallery(folder, prefix, n, label, opts={}){
  let h=''; for(let i=1;i<=n;i++) h+=slot(`${dir(folder)}/${prefix}-${i}`, `${label} ${i}`, opts);
  return `<div class="slots">${h}</div>`;
}
function embed(kind, id, label, thumb){
  const src = kind==='video' ? `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`
            : kind==='list'  ? `https://www.youtube.com/embed/videoseries?list=${id}&autoplay=1`
            : kind==='reel' ? `https://www.instagram.com/reel/${id}/embed`
            : kind==='post' ? `https://www.instagram.com/p/${id}/embed`
            : id;
  const th = thumb ? ` style="--thumb:url(${thumb})"` : '';
  return `<div class="embed ${kind==='frame'?'mag':(kind==='reel'||kind==='post')?'reel':''}" data-src="${esc(src)}"${th} role="button" tabindex="0" aria-label="${esc(label)}">
    <div class="play"><span>▶</span></div><div class="elbl">${esc(label)}</div></div>`;
}
const btn = (href,txt,pri) => `<a class="btn ${pri?'pri':''}" href="${esc(href)}" target="_blank" rel="noopener">${esc(txt)}</a>`;
const card = ({title,meta,body,list,media,btns}) => `<article class="card">
  ${media||''}<h3>${t(title)}</h3>${meta?`<div class="meta">${t(meta)}</div>`:''}
  ${body?`<p>${t(body)}</p>`:''}${list?`<ul>${list.map(x=>`<li>${t(x)}</li>`).join('')}</ul>`:''}
  ${btns?`<div class="btns">${btns}</div>`:''}</article>`;
const head = (p, title, sub) => `<div class="ptitle" style="--c1:${p.c1};--c2:${p.c2};--glow:${p.glow}"><div class="pi">${p.ico}</div><h1>${t(title)}</h1></div>${sub?`<p class="psub">${t(sub)}</p>`:'<div style="height:20px"></div>'}`;

const SS=[0,1,2].map(()=>{
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3)); g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(6),3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})); l.frustumCulled=false; l.visible=false; shoot.add(l);
  return {l,life:0,p:new THREE.Vector3(),v:new THREE.Vector3()};
});
function spawnShoot(){
  const s=SS.find(x=>x.life<=0); if(!s) return;
  const u=Math.random()*.9+.1, a=Math.random()*6.283, r=650, sn=Math.sqrt(1-u*u);
  s.p.set(r*sn*Math.cos(a),r*u,r*sn*Math.sin(a));
  s.v.set(Math.random()-.5,-(Math.random()*.4+.1),Math.random()-.5).normalize().multiplyScalar(520); s.life=1; s.l.visible=true;
}
function updShoot(dt){
  shoot.position.copy(camera.position);
  if(Math.random()<dt*.35) spawnShoot();
  for(const s of SS){ if(s.life<=0) continue; s.life-=dt*1.1; if(s.life<=0){s.l.visible=false;continue;}
    s.p.addScaledVector(s.v,dt); const tail=s.p.clone().addScaledVector(s.v.clone().normalize(),-70);
    const pa=s.l.geometry.attributes.position, ca=s.l.geometry.attributes.color, f=Math.min(1,s.life*2);
    pa.setXYZ(0,s.p.x,s.p.y,s.p.z); pa.setXYZ(1,tail.x,tail.y,tail.z); ca.setXYZ(0,f,f,f); ca.setXYZ(1,0,0,0); pa.needsUpdate=ca.needsUpdate=true; }
}

/* ---------- labels ---------- */
const labelsEl=$('#labels'); const LB={};
const mkLbl=(id,cls)=>{const d=document.createElement('div');d.className='lbl '+(cls||'');d.onclick=()=>pick(id);labelsEl.appendChild(d);return d;};
PLANETS.forEach(p=>{LB[p.id]=mkLbl(p.id);LB[p.id].style.display="none";});
const sunLbl=mkLbl('me','sunl'); sunLbl.style.display='none';
let LV=true;
window.refreshLabels=()=>{
  PLANETS.forEach(p=>{LB[p.id].innerHTML=`<span class="i">${p.ico}</span>${t(p.name)}`;});
  sunLbl.dataset.v='';  // force re-render
};
function renderSunLbl(){
  const key=mode+'|'+lang+'|'+(window.__portrait||'');
  if(sunLbl.dataset.v===key) return; sunLbl.dataset.v=key;
  if(mode==='sun'){ sunLbl.className='lbl cta'; sunLbl.innerHTML='✦ '+t(UI.cta)+' ✦'; }
  else { sunLbl.className='lbl sunl'; sunLbl.innerHTML=`<div class="av">${window.__portrait?`<img src="${window.__portrait}" alt="">`:'LG'}</div>LEGJIONA GJERGJI<small>${t(UI.profile)}</small>`; }
}
window.refreshLabels();

/* ---------- state ---------- */
let mode='sun';          // sun | profile | home | focus
let focusId=null, galStart=0, T=0, tScale=1, userZ=1;
const sph={az:.35,el:.12,rad:44,azT:.35,elT:.12};
const look=new THREE.Vector3(), camTmp=new THREE.Vector3(), lookT=new THREE.Vector3();
const mouse=new THREE.Vector2(0,0), ndc=new THREE.Vector2(9,9);
const ray=new THREE.Raycaster(); let hovered=null, dragging=false, moved=0, downX=0,downY=0;
let dk=1,dkT=1,sk=1,skT=1,radHome=118,elHome=.42;
const mapD=D=>D*(1-dk)+(13+(D-17)*.42)*dk;
const isNarrow=()=>innerWidth<820;

function layout(){
  const asp=innerWidth/innerHeight;
  if(asp<1){ dkT=1; skT=1.75; elHome=1.0; radHome=Math.min(300,(40)/(.445*asp)*.9); }
  else { dkT=0; skT=1; elHome=.42; radHome=asp<1.3?150:118; }
  labelsEl.classList.toggle("icons",innerWidth<820);
}
function resize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false); composer.setSize(innerWidth,innerHeight); layout();
}
addEventListener('resize',resize); layout(); dk=dkT; sk=skT;
camera.position.set(0,5,55); look.set(0,0,0);

/* ---------- transitions ---------- */
function toProfile(){
  mode='profile'; focusId=null; $('#profile').classList.add('show');
  $('#hint').classList.add('hide'); labelsEl.classList.add('hide'); document.body.classList.remove('st-galaxy');
}
function toGalaxy(){
  mode='home'; galStart=T; $('#profile').classList.remove('show');
  sph.az=Math.atan2(camera.position.x,camera.position.z); sph.azT=sph.az; sph.elT=elHome; sph.el=Math.asin(camera.position.y/Math.max(1,camera.position.length())); userZ=1;
  sph.rad=camera.position.length();
  labelsEl.classList.remove('hide'); $('#hint').classList.remove('hide'); document.body.classList.add('st-galaxy');
}
function pick(id){
  if(mode==='sun'){ toProfile(); return; }
  if(mode!=='home') return;
  mode='focus'; focusId=id; labelsEl.classList.add('hide'); $('#hint').classList.add('hide');
  const my=id; setTimeout(()=>{ if(mode==='focus'&&focusId===my) openPanel(my); },1250);
}
window.onPanelClose=()=>{ if(mode==='focus'){ mode='home'; focusId=null; labelsEl.classList.remove('hide'); $('#hint').classList.remove('hide'); } };
$('#pMore').onclick=toGalaxy;
document.querySelector('.brand').onclick=()=>{ if(mode==='home') toProfile(); };

/* ---------- input ---------- */
function setNdc(e){ndc.x=e.clientX/innerWidth*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;mouse.set(ndc.x,ndc.y);}
function hit(){
  if(mode==='profile'||mode==='focus') return null;
  ray.setFromCamera(ndc,camera);
  const list=hitMeshes.filter(m=>m===sun||P.find(p=>p.mesh===m).app>.6);
  const h=ray.intersectObjects(list,false)[0]; return h?h.object.userData.id:null;
}
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;downX=e.clientX;downY=e.clientY;setNdc(e);canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{
  setNdc(e);
  if(dragging){ const dx=e.clientX-downX, dy=e.clientY-downY; moved+=Math.abs(dx)+Math.abs(dy); downX=e.clientX;downY=e.clientY;
    if(mode==='home'){ sph.azT-=dx*.005; sph.elT=Math.max(.08,Math.min(1.35,sph.elT+dy*.004)); } }
});
canvas.addEventListener('pointerup',e=>{
  dragging=false; canvas.classList.remove('drag'); setNdc(e);
  if(moved<7){ const id=hit(); if(id) pick(id); }
});
canvas.addEventListener('wheel',e=>{ if(mode!=='home') return; e.preventDefault(); userZ=Math.max(.55,Math.min(3.4,userZ*(1+e.deltaY*.0012))); },{passive:false});
let pinch=0;
canvas.addEventListener('touchmove',e=>{ if(e.touches.length===2&&mode==='home'){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(pinch) userZ=Math.max(.55,Math.min(3.4,userZ*pinch/d)); pinch=d; } },{passive:true});
canvas.addEventListener('touchend',()=>pinch=0);

/* ---------- loop ---------- */
const V=new THREE.Vector3(), up=new THREE.Vector3(0,1,0), camRight=new THREE.Vector3();
const ease=x=>1-Math.pow(1-x,3);
const clock=new THREE.Clock();
let galFade=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05); T+=dt; U.uTime.value=T;
  const galOn=(mode==='home'||mode==='focus');
  galFade+=((galOn?1:0)-galFade)*(1-Math.exp(-dt*(galOn?.9:2.5)));
  galaxyU.uFade.value=galFade; nebU.value=.05+.95*galFade; bg.material.color.setScalar(nebU.value);
  galaxy.userData.core.material.opacity=galFade*.55;
  galaxy.scale.setScalar(.55+.45*ease(Math.min(1,galFade)));
  galaxy.rotation.y+=dt*.004;
  dk+=(dkT-dk)*(1-Math.exp(-dt*4)); sk+=(skT-sk)*(1-Math.exp(-dt*4));
  tScale+=(((mode==='focus')?.04:1)-tScale)*(1-Math.exp(-dt*3));

  // sun pulse
  const pulse=1+Math.sin(T*1.6)*.03; corona.forEach((c,i)=>{c.scale.set(c.userData.s*pulse*(i?1+Math.sin(T*.7+i)*.04:1),c.userData.s*pulse,1);});
  sun.rotation.y+=dt*.02;

  // planets
  orbitsGroup.children.forEach(l=>{const k=mapD(l.userData.D)/l.userData.D;l.scale.set(k,1,k);});
  const tg=T-galStart;
  P.forEach(p=>{
    p.a+=p.d.sp*dt*tScale*.6;
    const tgt=(galOn&&tg>p.i*.16)?1:0; p.app+=(tgt-p.app)*(1-Math.exp(-dt*(tgt?2.4:5)));
    const D=mapD(p.d.D);
    p.grp.position.set(Math.cos(p.a)*D,Math.sin(p.a*2+p.i)*1.2,Math.sin(p.a)*D);
    p.mesh.rotation.y+=dt*(.25+p.i*.03);
    const hv=(hovered===p.id)?1.12:1; p.hv+=(hv-p.hv)*(1-Math.exp(-dt*8));
    const s=Math.max(.0001,ease(Math.min(1,p.app))*sk*p.hv); p.grp.scale.setScalar(s); p.grp.visible=p.app>.01;
    p.moons.forEach(m=>m.rotation.y+=dt*m.userData.sp);
  });
  orbitMats.forEach(m=>m.opacity=.1*Math.min(1,galFade*1.2));

  // camera
  let rate=3;
  if(mode==='sun'){ sph.azT+=dt*.03; sph.az+=(sph.azT-sph.az)*(1-Math.exp(-dt*3)); camTmp.set((isNarrow()?64:50)*Math.sin(sph.az),5,(isNarrow()?64:50)*Math.cos(sph.az)); lookT.set(0,0,0); rate=3; }
  else if(mode==='profile'){ const narrow=isNarrow(); const off=narrow?0:-9; camTmp.set(off,2.5,narrow?36:27); lookT.set(off,narrow?-3:0,0); rate=1.6; }
  else if(mode==='home'){
    if(!dragging) sph.azT+=dt*.012;
    const k=1-Math.exp(-dt*4); sph.az+=(sph.azT-sph.az)*k; sph.el+=(sph.elT-sph.el)*k;
    const rT=radHome*userZ; sph.rad+=(rT-sph.rad)*(1-Math.exp(-dt*(tg<4?1.1:4)));
    camTmp.set(sph.rad*Math.cos(sph.el)*Math.sin(sph.az),sph.rad*Math.sin(sph.el),sph.rad*Math.cos(sph.el)*Math.cos(sph.az));
    lookT.set(mouse.x*3,mouse.y*1.6,0); rate=tg<4?1.3:4;
  }
  else if(mode==='focus'){
    if(focusId==="me"){ camTmp.set(isNarrow()?0:-7,4,26); lookT.set(isNarrow()?0:-7,0,0); rate=2.2; }
    else{
    const p=P.find(x=>x.id===focusId), pw=p.grp.position, R=p.d.R*sk, out=V.copy(pw).setY(0).normalize();
    const dist=R*5.4; camRight.crossVectors(out,up).normalize();
    camTmp.copy(pw).addScaledVector(out,-dist).addScaledVector(camRight,dist*.35); camTmp.y+=R*1.1;
    lookT.copy(pw); if(!isNarrow()) lookT.addScaledVector(camRight,R*2.1); rate=2.2;
    }
  }
  const kc=1-Math.exp(-dt*rate);
  camera.position.lerp(camTmp,kc); look.lerp(lookT,kc); camera.lookAt(look);
  bg.position.copy(camera.position); stars.position.copy(camera.position);

  // hover
  const h=dragging?null:hit(); if(h!==hovered){ hovered=h; canvas.classList.toggle('hov',!!h); Object.entries(LB).forEach(([id,el])=>el.classList.toggle('hv',id===h)); sunLbl.classList.toggle('hv',h==='me'); }
  updShoot(dt); updLabels();
  composer.render();
  requestAnimationFrame(frame);
}
function proj(v,out){ V.copy(v).project(camera); out.x=(V.x*.5+.5)*innerWidth; out.y=(-V.y*.5+.5)*innerHeight; out.z=V.z; }
const o={x:0,y:0,z:0};
function updLabels(){
  renderSunLbl();
  if(mode==='sun'||mode==='home'){
    sunLbl.style.display='flex';
    const v=mode==='sun'?new THREE.Vector3(0,0,0):new THREE.Vector3(0,-SUN_R*1.25,0);
    proj(v,o); sunLbl.style.transform=`translate(${o.x}px,${o.y}px) translate(-50%,${mode==='sun'?'-50%':'0'})`;
    sunLbl.style.opacity=(mode==='home'&&galFade<.4)?0:1;
  } else sunLbl.style.display='none';
  if(mode!=='home') return;
  P.forEach(p=>{
    const el=LB[p.id]; if(p.app<.5){el.style.display='none';return;} el.style.display='flex';
    const v=p.grp.position.clone(); v.y+=p.d.R*sk*1.55+.6; proj(v,o);
    el.style.transform=`translate(${o.x}px,${o.y}px) translate(-50%,-100%)`; el.style.opacity=o.z>1?0:Math.min(1,(p.app-.5)*2);
  });
}

window.__ready=true; canvas.classList.add("ready");
frame();
const h0=location.hash.slice(1);
if(h0==='me'||PLANETS.some(p=>p.id===h0)){ toProfile(); toGalaxy(); galStart=-10; pick(h0); }
}
</script>
</body>
